global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'poc-threads-monitor'
    environment: 'development'

# Cargar reglas de alertas
rule_files:
  - 'alerts.yml'

# Configuración de scraping
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Aplicación Java - Web Client Blocking (Platform Threads)
  - job_name: 'web-client-blocking'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          thread_type: 'platform'
          app: 'web-client-blocking'
          service: 'web-client-blocking'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s

  # Aplicación Java - Web Server Blocking
  - job_name: 'web-server-blocking'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          app: 'web-server-blocking'
          service: 'web-server-blocking'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s

  # Aplicación Java - Web Client Reactive
  - job_name: 'web-client-reactive'
    static_configs:
      - targets: ['host.docker.internal:8090']
        labels:
          thread_type: 'reactive'
          app: 'web-client-reactive'
          service: 'web-client-reactive'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s

  # Aplicación Java - Web Server Reactive
  - job_name: 'web-server-reactive'
    static_configs:
      - targets: ['host.docker.internal:8091']
        labels:
          app: 'web-server-reactive'
          service: 'web-server-reactive'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s

  # Aplicación Java - Web Client Virtual Threads
  - job_name: 'web-client-vt'
    static_configs:
      - targets: ['host.docker.internal:8095']
        labels:
          thread_type: 'virtual'
          app: 'web-client-vt'
          service: 'web-client-vt'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s

  # Aplicación Java - Web Server Virtual Threads
  - job_name: 'web-server-vt'
    static_configs:
      - targets: ['host.docker.internal:8096']
        labels:
          app: 'web-server-vt'
          service: 'web-server-vt'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s

  # PostgreSQL (si usas postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Kafka JMX Exporter (si decides agregarlo)
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka-exporter:9308']